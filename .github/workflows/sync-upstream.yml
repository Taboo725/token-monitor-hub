# Mirrors the upstream Hub (Javis603/token-monitor, directory worker/) into the
# root of this repo. Cloudflare Workers Builds redeploys on every push to main,
# so a successful sync is also a deploy.
name: Sync hub from upstream

on:
  schedule:
    - cron: '23 19 * * *' # daily, 03:23 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream worker/
        run: |
          git clone --depth 1 https://github.com/Javis603/token-monitor.git "$RUNNER_TEMP/upstream"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/upstream" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # .github/ is excluded so this workflow survives the --delete.
          rsync -a --delete --exclude '.git/' --exclude '.github/' "$RUNNER_TEMP/upstream/worker/" ./

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date with upstream $UPSTREAM_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: sync hub from upstream $UPSTREAM_SHA"
          git push
